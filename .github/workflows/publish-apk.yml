name: Publish signed Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.6.0"
        required: true
        default: "v0.6.0"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release source and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Public releases must be built from main."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v0.6.0"
            exit 1
          fi
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          if [[ "v$APP_VERSION" != "$VERSION" ]]; then
            echo "::error::Requested tag $VERSION does not match Android versionName $APP_VERSION."
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Bump versionName/versionCode instead of replacing a distributed build."
            exit 1
          fi

      - name: Validate release-signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in repository Actions secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tajik-stt-release.jks"
          chmod 600 "$RUNNER_TEMP/tajik-stt-release.jks"

      - name: Test and build signed release APK and AAB
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/tajik-stt-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest verifyReleaseSigningConfigured assembleRelease bundleRelease

      - name: Verify release signatures
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [[ ! -f "$APK" ]]; then
            echo "::error::Signed release APK was not produced at $APK"
            exit 1
          fi
          if [[ ! -f "$AAB" ]]; then
            echo "::error::Signed release AAB was not produced at $AAB"
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify -verbose "$AAB" >/dev/null

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Tajik-STT-Collector.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/Tajik-STT-Collector.aab

      - name: Keep APK and AAB as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tajik-STT-Collector-${{ inputs.version }}
          path: |
            dist/Tajik-STT-Collector.apk
            dist/Tajik-STT-Collector.aab
          if-no-files-found: error

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            "dist/Tajik-STT-Collector.apk#Tajik STT Collector — signed release APK" \
            "dist/Tajik-STT-Collector.aab#Tajik STT Collector — signed Google Play AAB" \
            --target "$GITHUB_SHA" \
            --title "Tajik STT Collector $VERSION" \
            --notes "Signed Android release for Tajik STT Collector. Google Play upload: Tajik-STT-Collector.aab. Android 8.0 or newer is required."
