name: Publish test APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v0.1.0"
            exit 1
          fi

      - name: Test and build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare download file
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Tajik-STT-Collector.apk

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tajik-STT-Collector-${{ inputs.version }}
          path: dist/Tajik-STT-Collector.apk
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/Tajik-STT-Collector.apk --clobber
          else
            gh release create "$VERSION" \
              "dist/Tajik-STT-Collector.apk#Tajik STT Collector — test APK" \
              --target "$GITHUB_SHA" \
              --title "Tajik STT Collector $VERSION" \
              --notes "Installable MVP test build. Android 8.0 or newer is required."
          fi
